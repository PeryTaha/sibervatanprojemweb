<!DOCTYPE html>
<html lang="tr" ng-app="blogApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siber Vatan | Yönetim Girişi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="../style2.css" rel="stylesheet">
    <script src="../angular.min.js"></script>
    <script src="../ng.js"></script>
</head>
<body ng-controller="LoginController">
    <main class="login-frame">
        <section class="login-card">
            <a class="back-link" href="../indexx.html"><i class="fa-solid fa-arrow-left"></i> Siteye dön</a>
            <p class="kicker">Yönetim alanı</p>
            <h1>Yönetim Girişi</h1>
            <p>İçerik yönetimi için yetkili kullanıcı bilgileriyle giriş yap.</p>

            <form ng-submit="girisYap()" novalidate>
                <label class="field">
                    <span>Kullanıcı adı</span>
                    <input type="text" ng-model="user.kullaniciadi" autocomplete="username">
                </label>

                <label class="field">
                    <span>Şifre</span>
                    <input type="password" ng-model="user.sifre" autocomplete="current-password">
                </label>

                <button type="submit">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Giriş Yap
                </button>
            </form>
            <p class="login-message" ng-if="loginMesaj">{{loginMesaj}}</p>
        </section>
    </main>
</body>
</html>
