<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeryTaha | Yazılar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styla.css">
    <script src="angular.min.js"></script>
    <script src="ng.js"></script>
</head>
<body ng-app="blogApp" ng-controller="blogController">
    <div class="page-frame">
        <header class="topbar">
            <nav class="topnav">
                <a href="indexx.html">Ana Sayfa</a>
                <a class="active" href="blog.html">Yazılar</a>
                <a href="iletisim.html">İletişim</a>
            </nav>
        </header>

        <main class="workspace">
            <section class="page-title">
                <p class="kicker">Blog</p>
                <h1>Yazılarım</h1>
                <p>Siber güvenlik, ağ teknolojileri ve öğrendiklerim üzerine tuttuğum sade notlar.</p>
            </section>

            <section class="archive-toolbar">
                <div>
                    <span class="toolbar-label">Yayın sayısı</span>
                    <strong>{{(bloglar || []).length}}</strong>
                </div>
                <label class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" ng-model="arama" placeholder="Yazı ara...">
                </label>
            </section>

            <section class="post-grid">
                <article class="post-card" ng-repeat="blog in bloglar | filter:arama">
                    <div class="post-meta">
                        <span class="tag">{{blog.etiket || 'Genel'}}</span>
                        <span>#{{blog.id}}</span>
                    </div>
                    <h2>{{blog.baslik}}</h2>
                    <p>{{blog.ozet}}</p>
                    <a href="devam.html?id={{blog.id}}">Devamını oku <i class="fa-solid fa-arrow-right"></i></a>
                </article>

                <div class="empty-state" ng-if="!bloglar || bloglar.length === 0">
                    <i class="fa-regular fa-folder-open"></i>
                    <p>Henüz yayınlanmış yazı görünmüyor.</p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
